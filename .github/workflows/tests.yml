name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.2', framework: '11', bench: '9', resolution: lowest }
          - { php: '8.2', framework: '12', bench: '10', resolution: lowest }
          - { php: '8.3', framework: '12', bench: '10', resolution: highest }
          - { php: '8.3', framework: '13', bench: '11', resolution: lowest }
          - { php: '8.4', framework: '13', bench: '11', resolution: highest }
          - { php: '8.5', framework: '13', bench: '11', resolution: highest }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, pdo_mysql, pdo_pgsql, intl
          coverage: none
      - name: Resolve framework profile
        env:
          COMPOSER_ROOT_VERSION: dev-main
          FRAMEWORK: ${{ matrix.framework }}
          BENCH: ${{ matrix.bench }}
          RESOLUTION: ${{ matrix.resolution }}
        run: |
          composer require --no-update "illuminate/database:^$FRAMEWORK.0" "illuminate/support:^$FRAMEWORK.0" "illuminate/events:^$FRAMEWORK.0" "illuminate/console:^$FRAMEWORK.0" "illuminate/contracts:^$FRAMEWORK.0"
          composer require --dev --no-update "orchestra/testbench:^$BENCH.0"
          # Laravel 11 is past security support; let Composer resolve it anyway.
          if test "$FRAMEWORK" = 11; then composer config audit.block-insecure false; fi
          if test "$RESOLUTION" = lowest; then composer update --prefer-lowest --prefer-stable --no-interaction --no-progress; else composer update --prefer-dist --no-interaction --no-progress; fi
      - name: SQLite regression and upgrade tests
        run: composer test
      - name: Formatting and static analysis
        if: matrix.php == '8.5' && matrix.resolution == 'highest'
        run: |
          composer validate --strict
          composer audit --locked
          composer format:check
          composer analyse
  databases:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: ['12', '13']
        database: [mysql, pgsql]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: tagging-test
          MYSQL_DATABASE: tagging
        ports: ['13316:3306']
        options: >-
          --health-cmd="mysqladmin ping -ptagging-test"
          --health-interval=10s --health-timeout=5s --health-retries=10
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: tagging-test
          POSTGRES_DB: tagging
        ports: ['15436:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d tagging"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, pdo_mysql, pdo_pgsql, intl
          coverage: none
      - name: Install selected framework
        env:
          COMPOSER_ROOT_VERSION: dev-main
          FRAMEWORK: ${{ matrix.framework }}
        run: |
          if test "$FRAMEWORK" = 12; then BENCH=10; else BENCH=11; fi
          composer require --no-update "illuminate/database:^$FRAMEWORK.0" "illuminate/support:^$FRAMEWORK.0" "illuminate/events:^$FRAMEWORK.0" "illuminate/console:^$FRAMEWORK.0" "illuminate/contracts:^$FRAMEWORK.0"
          composer require --dev --no-update "orchestra/testbench:^$BENCH.0"
          composer update --prefer-dist --no-interaction --no-progress
      - name: Real database regression and independent-process races
        run: bash scripts/test-database '${{ matrix.database }}' '' --log-junit database-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tagging-${{ matrix.framework }}-${{ matrix.database }}
          path: database-results.xml
